services:
  - type: web
    name: knowledge-hub-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./knowledge_hub.db
      - key: ALLOWED_GOOGLE_DOMAIN
        value: yourcompany.com
      - key: FRONTEND_URL
        value: https://knowledge-hub-ai.onrender.com
      - key: BACKEND_URL
        value: https://knowledge-hub-ai.onrender.com
